<!--
  SkyRoute — single colour, no disc. Takes `currentColor`.

  For the footer, for print, and for anything that has to survive a
  black-and-white printer. Without the disc the mark loses the weight the disc
  was carrying, so it is enlarged and the route is re-anchored to the
  bottom-left of the box rather than to the disc's interior.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SkyRoute">
  <g fill="currentColor" stroke="currentColor">
    <path d="M9 36.5C15.4 37.2 21 33.6 25.4 26.2" fill="none"
          stroke-width="3.6" stroke-linecap="round" opacity=".5"/>
    <circle cx="9" cy="36.5" r="3.3" stroke="none"/>
    <path d="M17 0 L-8 -10 L-1 0 L-8 10 Z" stroke="none"
          transform="translate(28 20) rotate(-45) scale(1.04)"/>
  </g>
</svg>
