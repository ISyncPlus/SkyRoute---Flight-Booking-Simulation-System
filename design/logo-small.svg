<!--
  SkyRoute — the 16–32 px cut. Source of app/icon.svg.

  Same mark, re-cut the way a type foundry cuts a caption weight differently
  from a display weight:
    · route stroke thickened 3.2 -> 3.8 and opacity raised, so it survives a
      16 px raster instead of dissolving into the disc
    · aircraft enlarged from .82 to .88 to hold its silhouette
    · waypoint 3.0 -> 3.1, since a 1 px disc at this size reads as noise
    · disc taken to the full 24 radius — at 16 px the 1 px inset was landing
      as a ring of half-lit pixels
    · sheen removed, being invisible below about 32 px
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="SkyRoute">
  <defs>
    <linearGradient id="srDiscSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19AD9C"/>
      <stop offset="1" stop-color="#0A564D"/>
    </linearGradient>
  </defs>

  <circle cx="24" cy="24" r="24" fill="url(#srDiscSm)"/>
  <path d="M11.8 32.8C16.8 33.4 21.2 30.4 24.8 24.4" fill="none" stroke="#ffffff"
        stroke-width="3.8" stroke-linecap="round" opacity=".92"/>
  <circle cx="11.8" cy="32.8" r="3.1" fill="#ffffff"/>
  <path d="M17 0 L-8 -10 L-1 0 L-8 10 Z" fill="#ffffff"
        transform="translate(26.3 20.6) rotate(-45) scale(.88)"/>
</svg>
